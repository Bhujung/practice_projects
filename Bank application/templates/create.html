<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Create Account</h1>

    <form action="/create" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Enter Account Name"
            required>

        <input
            type="number"
            name="balance"
            placeholder="Enter Initial Balance"
            required>

        <button type="submit">
            Create Account
        </button>

    </form>

</div>

</body>
</html>
